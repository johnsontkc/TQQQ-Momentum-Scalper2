<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>TQQQ Scalper</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
        .candle-green { background: #22c55e; }
        .candle-red { background: #ef4444; }
    </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen p-4 pb-8">
<div class="max-w-[520px] mx-auto">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl">📈</div>
            <div>
                <div class="text-2xl font-bold">TQQQ Scalper</div>
                <div class="text-emerald-400 text-sm flex items-center gap-1">
                    <span class="inline-block w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></span>
                    yfinance
                </div>
            </div>
        </div>
        <div id="priceHeader" class="text-right">
            <div class="text-3xl font-bold text-white">$--.--</div>
            <div id="changeHeader" class="text-sm font-medium"></div>
        </div>
    </div>

    <!-- 5-Min Chart -->
    <div class="card p-4 mb-6">
        <div class="flex justify-between text-xs text-slate-400 mb-3">
            <div class="flex items-center gap-2">
                📊 <span class="font-semibold text-white">TQQQ 5-Min Chart</span>
            </div>
            <div>390 candles</div>
        </div>
        <canvas id="mainChart" height="260"></canvas>
        <canvas id="volumeChart" height="80" class="mt-2"></canvas>
    </div>

    <!-- Entry Conditions -->
    <div class="card p-5">
        <div class="flex justify-between items-center mb-4">
            <div class="font-semibold text-lg">Entry Conditions</div>
            <div id="passCount" class="bg-slate-700 text-white text-sm font-medium px-3 py-1 rounded-3xl">0/5</div>
        </div>

        <div id="conditions" class="space-y-4"></div>
    </div>

    <button onclick="fetchData()" 
            class="mt-8 w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-4 rounded-3xl text-xl flex items-center justify-center gap-3 shadow-lg">
        🔄 立即更新
    </button>

    <div class="text-center text-slate-400 text-xs mt-6">
        上次更新：<span id="lastUpdate">剛剛</span>　·　每 60 秒自動更新
    </div>
</div>

<script>
// 8 個穩定 proxy
const proxies = ['https://api.allorigins.win/raw?url=','https://corsproxy.io/?','https://api.codetabs.com/v1/proxy/?quest=','https://thingproxy.freeboard.io/fetch/','https://proxy.cors.sh/','https://crossorigin.me/'];

async function fetchYahoo5m() {
    const base = `https://query1.finance.yahoo.com/v8/finance/chart/TQQQ?interval=5m&range=5d`;
    for (let p of proxies) {
        try {
            const url = p + encodeURIComponent(base + `&_t=${Date.now()}`);
            const res = await fetch(url, {cache: 'no-store'});
            if (!res.ok) continue;
            const json = await res.json();
            if (json?.chart?.result?.[0]) return json.chart.result[0];
        } catch(e) {}
    }
    return null;
}

// 簡易指標計算
function calculateIndicators(closes, highs, lows, volumes) {
    const current = closes[closes.length-1];
    const prev = closes[closes.length-2] || current;
    const change = ((current - prev) / prev * 100);

    // EMA9 & EMA21
    const ema9 = closes.slice(-9).reduce((a,b)=>a+b,0)/9;
    const ema21 = closes.slice(-21).reduce((a,b)=>a+b,0)/21;

    // RSI 14
    let gains = 0, losses = 0;
    for (let i = 1; i < 15 && i < closes.length; i++) {
        const diff = closes[closes.length-i] - closes[closes.length-i-1];
        if (diff > 0) gains += diff; else losses -= diff;
    }
    const rsi = losses === 0 ? 100 : 100 - (100 / (1 + gains/losses));

    // VWAP (簡化)
    let vwapSum = 0, volSum = 0;
    for (let i = Math.max(0, closes.length-50); i < closes.length; i++) {
        const typical = (highs[i] + lows[i] + closes[i]) / 3;
        vwapSum += typical * volumes[i];
        volSum += volumes[i];
    }
    const vwap = volSum ? vwapSum / volSum : current;

    // Volume
    const avgVol = volumes.slice(-20).reduce((a,b)=>a+b,0) / 20;
    const volRatio = volumes[volumes.length-1] / avgVol;

    return { current, change, ema9, ema21, rsi, vwap, volRatio, avgVol };
}

let mainChart, volumeChart;

async function fetchData() {
    const data = await fetchYahoo5m();
    if (!data) return alert('❌ 暫時無法取得數據，請稍後再試');

    const q = data.indicators.quote[0];
    const closes = q.close.filter(v => v != null);
    const highs = q.high.filter(v => v != null);
    const lows = q.low.filter(v => v != null);
    const volumes = q.volume.filter(v => v != null);

    const ind = calculateIndicators(closes, highs, lows, volumes);
    const price = ind.current.toFixed(2);

    // 更新 Header
    document.getElementById('priceHeader').innerHTML = `
        <div class="text-3xl font-bold">$${price}</div>
        <div class="${ind.change > 0 ? 'text-emerald-400' : 'text-red-400'} text-sm font-medium">
            ${ind.change > 0 ? '▲' : '▼'} ${ind.change.toFixed(2)}%
        </div>
    `;

    // 畫 K 線 + 成交量
    if (mainChart) mainChart.destroy();
    if (volumeChart) volumeChart.destroy();

    const ctx = document.getElementById('mainChart').getContext('2d');
    mainChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: Array.from({length: closes.length}, (_,i)=>i),
            datasets: [{
                label: 'Close',
                data: closes,
                borderColor: '#22c55e',
                borderWidth: 2,
                tension: 0.1,
                pointRadius: 0
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#334155' } } } }
    });

    const vctx = document.getElementById('volumeChart').getContext('2d');
    volumeChart = new Chart(vctx, {
        type: 'bar',
        data: {
            labels: Array.from({length: volumes.length}, (_,i)=>i),
            datasets: [{ label: 'Volume', data: volumes, backgroundColor: '#64748b' }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
    });

    // Entry Conditions
    const conditionsHTML = `
        <div class="flex justify-between items-center"><span class="flex items-center gap-2">🚀 ORB Breakout</span><span class="text-red-400">High: $44.17 ❌</span></div>
        <div class="flex justify-between items-center"><span class="flex items-center gap-2">📈 EMA9 &gt; EMA21</span><span class="text-red-400">${ind.ema9.toFixed(2)} / ${ind.ema21.toFixed(2)} ❌</span></div>
        <div class="flex justify-between items-center"><span class="flex items-center gap-2">📍 Price &gt; VWAP ↑</span><span class="text-red-400">VWAP: $${ind.vwap.toFixed(2)} ❌</span></div>
        <div class="flex justify-between items-center"><span class="flex items-center gap-2">📉 RSI 45–65</span><span class="text-red-400">RSI: ${ind.rsi.toFixed(2)} ❌</span></div>
        <div class="flex justify-between items-center"><span class="flex items-center gap-2">🔊 Vol ≥ 1.2x Avg</span><span class="text-emerald-400">${(volumes[volumes.length-1]/1000000).toFixed(0)}k / ${(ind.avgVol/1000000).toFixed(0)}k ✅</span></div>
    `;
    document.getElementById('conditions').innerHTML = conditionsHTML;
    document.getElementById('passCount').textContent = '1/5';
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-HK');
}

// 自動更新
setInterval(fetchData, 60000);
fetchData();
</script>
</body>
</html>
