<script>

const proxies = [
    'https://api.allorigins.win/raw?url=',

    'https://thingproxy.freeboard.io/fetch/',
    'https://proxy.cors.sh/'
];

async function fetchYahoo5m() {
    const base = `https://query1.finance.yahoo.com/v8/finance/chart/TQQQ?interval=5m&range=5d&includePrePost=false`;
    const statusEl = document.getElementById('status');

    for (let attempt = 0; attempt < 12; attempt++) {
        const proxy = proxies[attempt % proxies.length];
        const url = proxy + encodeURIComponent(base + `&_t=${Date.now()}`);

        statusEl.classList.remove('hidden');
        statusEl.innerHTML = `🔄 重試中... 第 ${attempt + 1}/12 次（${proxy.split('/')[2]}）`;

        try {
            const res = await fetch(url, {
                cache: 'no-store',
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36',
                    'Accept': 'application/json'
                }
            });

            if (!res.ok) continue;
            const json = await res.json();
            if (json?.chart?.result?.[0]) {
                statusEl.classList.add('hidden');
                return json.chart.result[0];
            }
        } catch(e) {}

        // 每次失敗等一下再試
        await new Promise(r => setTimeout(r, 800));
    }

    statusEl.innerHTML = '❌ 所有 proxy 都失敗，請 1 分鐘後再試';
    setTimeout(() => statusEl.classList.add('hidden'), 5000);
    return null;
}
