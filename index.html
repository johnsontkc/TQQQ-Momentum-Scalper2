<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TQQQ Momentum Scalper</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root { --bg: #0f172a; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
        .signal-buy { animation: glow 2s infinite alternate; }
    </style>
</head>
<body class="min-h-screen p-4">
<div class="max-w-[520px] mx-auto">

    <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-emerald-400">TQQQ Momentum Scalper</h1>
        <p class="text-slate-400 text-sm">5分鐘動能剝頭皮 · 實時訊號</p>
    </div>

    <div id="priceCard" class="card p-6 text-center mb-4">
        <div class="text-slate-400 text-xs mb-1">TQQQ 現價 (5分鐘)</div>
        <div id="price" class="text-5xl font-bold text-white">--</div>
        <div id="change" class="text-xl mt-2 font-semibold">--</div>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="card p-4 text-center">
            <div class="text-xs text-slate-400">EMA 9</div>
            <div id="ema9" class="text-2xl font-bold text-white">--</div>
        </div>
        <div class="card p-4 text-center">
            <div class="text-xs text-slate-400">RSI(14)</div>
            <div id="rsi" class="text-2xl font-bold text-white">--</div>
        </div>
        <div class="card p-4 text-center">
            <div class="text-xs text-slate-400">成交量</div>
            <div id="volume" class="text-2xl font-bold text-white">--</div>
        </div>
    </div>

    <div id="signalBox" class="card p-6 text-center mb-6 hidden">
        <div class="text-emerald-400 text-xl font-bold mb-2">🚀 BUY SIGNAL</div>
        <div id="signalDetail" class="text-white"></div>
    </div>

    <button onclick="fetchData()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-4 rounded-2xl text-lg flex items-center justify-center gap-2">
        🔄 立即更新
    </button>

    <div class="text-center text-slate-400 text-xs mt-8">
        上次更新：<span id="lastUpdate">剛剛</span><br>
        每 30 秒自動更新
    </div>
</div>

<script>
// 8 個強力 proxy（2026 年穩定版）
const proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://api.codetabs.com/v1/proxy/?quest=',
    'https://thingproxy.freeboard.io/fetch/',
    'https://proxy.cors.sh/',
    'https://crossorigin.me/',
    'https://api.allorigins.win/get?url=',
    'https://cors-anywhere.herokuapp.com/'
];

async function fetchYahoo5m() {
    const base = `https://query1.finance.yahoo.com/v8/finance/chart/TQQQ?interval=5m&range=5d&includePrePost=false`;
    for (let proxy of proxies) {
        try {
            const url = proxy + encodeURIComponent(base + `&_t=${Date.now()}`);
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) continue;
            const json = await res.json();
            if (json?.chart?.result?.[0]) return json.chart.result[0];
        } catch(e) {}
    }
    return null;
}

async function fetchData() {
    const priceEl = document.getElementById('price');
    priceEl.textContent = '載入中...';

    const data = await fetchYahoo5m();
    if (!data) {
        priceEl.textContent = '❌ 數據獲取失敗';
        return;
    }

    const quote = data.indicators.quote[0];
    const closes = quote.close.filter(v => v != null);
    const highs = quote.high.filter(v => v != null);
    const lows = quote.low.filter(v => v != null);
    const volumes = quote.volume.filter(v => v != null);

    const currentPrice = closes[closes.length-1];
    const prevPrice = closes[closes.length-2] || currentPrice;
    const change = ((currentPrice - prevPrice) / prevPrice * 100).toFixed(2);

    // 簡單指標
    const ema9 = closes.slice(-9).reduce((a,b)=>a+b,0)/9;
    const rsi = calculateRSI(closes.slice(-15)); // 簡易 RSI
    const avgVol = volumes.slice(-10).reduce((a,b)=>a+b,0)/10;

    document.getElementById('price').innerHTML = `$${currentPrice.toFixed(2)}`;
    document.getElementById('change').innerHTML = 
        `<span class="${change>0?'text-emerald-400':'text-red-400'}">${change>0?'▲':'▼'} ${change}%</span>`;

    document.getElementById('ema9').textContent = ema9.toFixed(2);
    document.getElementById('rsi').textContent = rsi.toFixed(1);
    document.getElementById('volume').textContent = (volumes[volumes.length-1]/1000000).toFixed(1) + 'M';

    // Momentum Scalper 訊號
    const isBuy = currentPrice > ema9 && rsi < 45 && volumes[volumes.length-1] > avgVol * 1.3;
    const signalBox = document.getElementById('signalBox');
    if (isBuy) {
        signalBox.classList.remove('hidden');
        signalBox.classList.add('signal-buy');
        document.getElementById('signalDetail').innerHTML = `
            5分鐘動能強勢<br>
            <span class="text-3xl font-bold text-emerald-400">立即進場</span><br>
            止損 ${ (currentPrice * 0.985).toFixed(2) }
        `;
    } else {
        signalBox.classList.add('hidden');
    }

    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('zh-HK');
}

// 簡易 RSI 計算
function calculateRSI(prices) {
    if (prices.length < 15) return 50;
    let gains = 0, losses = 0;
    for (let i = 1; i < prices.length; i++) {
        const diff = prices[i] - prices[i-1];
        if (diff > 0) gains += diff;
        else losses -= diff;
    }
    const avgGain = gains / 14;
    const avgLoss = losses / 14;
    return avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain/avgLoss));
}

// 自動更新
setInterval(fetchData, 30000);
fetchData(); // 首次載入
</script>
</body>
</html>
